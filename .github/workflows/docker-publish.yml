name: Docker

on:
  push:
    branches:
      - master

# Required for pushing to GHCR (github-actions bot needs packages: write)
permissions:
  contents: read
  packages: write

env:
  REGISTRY_IMAGE: ghcr.io/virgiawanprima/oryphemrouter

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push multi-arch
        uses: docker/build-push-action@v5
        with:
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.REGISTRY_IMAGE }}:latest
            ${{ env.REGISTRY_IMAGE }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.title=oryphemrouter
            org.opencontainers.image.description=OryphemRouter