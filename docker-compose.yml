services:
  oryphremrouter:
    image: ghcr.io/virgiawanprima/oryphemrouter:latest
    container_name: oryphremrouter
    restart: always
    ports:
      - "127.0.0.1:20129:20129"
    volumes:
      - oryphremrouter-data:/app/data
    env_file:
      - .env
    environment:
      DATA_DIR: /app/data
      PORT: "20129"
      HOSTNAME: "0.0.0.0"
      NODE_ENV: production
      HEADROOM_URL: http://headroom:8787
    depends_on:
      - headroom
    security_opt:
      - "no-new-privileges:true"
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:20129/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  headroom:
    image: ghcr.io/chopratejas/headroom:latest
    container_name: headroom
    restart: always
    # No port mapping — only accessible via Docker internal DNS
    security_opt:
      - "no-new-privileges:true"
    cap_drop:
      - ALL

volumes:
  oryphremrouter-data:
    name: oryphremrouter-data
